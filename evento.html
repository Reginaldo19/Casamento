body{

.invitation{

.paper{

.paper:after{

<audio id="backgroundAudio" src="fundo.mp3" loop preload="auto" playsinline aria-hidden="true"></audio>

<button id="audioToggle" class="audio-toggle" type="button"
        aria-label="Parar música" title="Parar música">
  <span id="audioIcon">🔊</span>
</button>

<script>
(() => {
  const audio = document.getElementById('backgroundAudio');
  const btn   = document.getElementById('audioToggle');
  const icon  = document.getElementById('audioIcon');

  if (!audio || !btn || !icon) return;

  // VOLUME DA MÚSICA: 0.58 = 58% | 1.0 = 100%
  audio.volume = 0.58;

  let unlocked = false;

  const setUI = (playing) => {
    icon.textContent = playing ? '🔊' : '🔇';
    btn.setAttribute('aria-label', playing ? 'Parar música' : 'Tocar música');
    btn.setAttribute('title',      playing ? 'Parar música' : 'Tocar música');
    btn.classList.toggle('is-muted', !playing);
  };

  const removeUnlockListeners = () => {
    document.removeEventListener('pointerdown', tryUnlock);
    document.removeEventListener('touchstart',  tryUnlock);
    document.removeEventListener('click',       tryUnlock);
    document.removeEventListener('keydown',     tryUnlock);
  };

  const tryUnlock = () => {
    if (unlocked) return;

    const p = audio.play();

    if (p && p.then) {
      p.then(() => {
        unlocked = true;
        removeUnlockListeners();
      }).catch(() => {
        // Navegador ainda bloqueou; mantém listeners para o próximo gesto.
      });
    }
  };

  audio.addEventListener('play',  () => setUI(true));
  audio.addEventListener('pause', () => setUI(false));

  setUI(false);

  document.addEventListener('pointerdown', tryUnlock);
  document.addEventListener('touchstart',  tryUnlock, { passive: true });
  document.addEventListener('click',       tryUnlock);
  document.addEventListener('keydown',     tryUnlock);

  btn.addEventListener('click', (e) => {
    e.stopPropagation();

    if (audio.paused) {
      audio.play().then(() => {
        unlocked = true;
        removeUnlockListeners();
      }).catch(() => {});
    } else {
      audio.pause();
    }
  });
})();
</script>

function safe(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function formatDate(value){
  if (!value) return "";

  const [year, month, day] = value.split("-");

    "julho","agosto","setembro","outubro","novembro","dezembro"
  ];

  return `${Number(day)} ${months[Number(month)-1]} ${year}`;
}

async function nameClaimKey(fullName){
  const normalized = String(fullName || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim()
    .replace(/\s+/g, " ");

  const bytes  = new TextEncoder().encode(normalized);
  const digest = await crypto.subtle.digest("SHA-256", bytes);

  return [...new Uint8Array(digest)]
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");
}

            <b>${safe(table.name || `Mesa ${i+1}`)}</b>
            <div>${(Array.isArray(table.guests) && table.guests.length)
              ? table.guests.map(person => `<div>• ${safe(person)}</div>`).join("")
              : "<em>Ainda sem convidados atribuídos.</em>"}</div>
          </div>
        `).join("") : '<p>As mesas ainda não foram organizadas. Consulte novamente mais tarde.</p>'}
      </div>
    `;
  }

  if (type === "location"){
    title = "Local do evento";
    html = `
      <p><strong>${safe(data.placeName || "Local do evento")}</strong></p>
      <p>${safe(data.address || "Endereço a indicar.")}</p>
      <p>${safe(data.locationNote)}</p>
    `;
  }

  if (type === "guide"){
    title = "Manual do convidado";
    html = `<p>${safe(data.guide || "Seja bem-vindo à nossa celebração!")}</p>`;
  }

  if (type === "dress"){
    title = "Dress code";
    html = `
      <p><strong>${safe(data.dressTitle || "Formal / Elegante")}</strong></p>
      <p>${safe(data.dressDescription)}</p>
    `;
  }

  $("modalTitle").textContent   = title;
  $("modalContent").innerHTML   = html;

  if (type === "tables"){
    const search = $("tableGuestSearch");
    const result = $("tableSearchResult");
    const tables = Array.isArray(data.tablePlan?.tables) ? data.tablePlan.tables : [];
    search.addEventListener("input", () => {
      const query = search.value.trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ");
      if (!query){
        result.textContent = "Digite o seu nome para localizar a sua mesa.";
        return;
      }
      const matches = [];
      tables.forEach((table, i) => (table.guests || []).forEach(person => {
        const normalized = String(person).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
        if (normalized.includes(query)) matches.push({person, table:table.name || `Mesa ${i+1}`});
      }));
      result.innerHTML = matches.length
        ? matches.map(m => `<div><b>${safe(m.person)}</b><br>Sua mesa: <strong>${safe(m.table)}</strong></div>`).join("<hr>")
        : "Não encontrámos esse nome. Confirme a escrita ou contacte os noivos.";
    });
  }

  if (type === "rsvp"){
    const area = $("rsvpFormArea");

    const openForm = (attendance) => {
      if (attendance === "yes"){
        area.innerHTML = `
          <form id="attendanceForm" class="rsvp-form">
            <label>Nome completo
              <input id="guestName" maxlength="100" required placeholder="Nome completo">
            </label>

            <label>Total de acompanhantes
              <input id="companionCount" type="number" min="0" max="20" value="0" required>
            </label>

            <div id="companionsFields"></div>

            <button class="submit" type="submit">Enviar confirmação</button>
            <div class="feedback" id="feedback"></div>
          </form>
        `;

        const count      = $("companionCount");
        const companions = $("companionsFields");

        const draw = () => {
          const n = Math.max(0, Math.min(20, Number(count.value) || 0));

          companions.innerHTML = Array.from({length:n}, (_, i) => `
            <div class="companion-row">
              <strong>Acompanhante ${i+1}</strong>

              <label>Nome completo
                <input class="companion-name" maxlength="100" required placeholder="Nome completo do acompanhante">
              </label>

              <label>Idade
                <input class="companion-age" type="number" min="0" max="120" required placeholder="Idade">
              </label>
            </div>
          `).join("");
        };

        count.addEventListener("input", draw);
        draw();

      } else {
        area.innerHTML = `
          <form id="attendanceForm" class="rsvp-form">
            <label>Nome completo
              <input id="guestName" maxlength="100" required placeholder="Nome completo">
            </label>

            <label>Motivo da ausência
              <textarea id="absenceReason" maxlength="500" rows="4" required placeholder="Indique o motivo"></textarea>
            </label>

            <button class="submit" type="submit">Enviar resposta</button>
            <div class="feedback" id="feedback"></div>
          </form>
        `;
      }

      $("attendanceForm").addEventListener("submit", async e => {
        e.preventDefault();

        const button   = e.submitter;
        const feedback = $("feedback");
        const name     = $("guestName").value.trim();

        if (!name) return;

        let record = {
          name,
          attendance: attendance === "yes" ? "Vou aparecer" : "Não vou poder ir",
          date: new Date().toISOString()
        };

        if (attendance === "yes"){
          const names = [...document.querySelectorAll(".companion-name")].map(x => x.value.trim());
          const ages  = [...document.querySelectorAll(".companion-age")].map(x => Number(x.value));

          if (names.some(x => !x) || ages.some(x => !Number.isFinite(x) || x < 0)) return;

          record.companions        = names.length;
          record.companionDetails  = names.map((companionName, i) => ({
            name: companionName,
            age:  ages[i]
          }));

        } else {
          record.reason = $("absenceReason").value.trim();
        }

        button.disabled    = true;
        button.textContent = "A enviar…";

        try{
          const newRef = push(ref(db, "rsvps/" + EVENT_ID));

          const claimNames = [
            name,
            ...(record.companionDetails || []).map(c => c.name)
          ];

          const normalized = claimNames.map(n =>
            n.normalize("NFD")
             .replace(/[\u0300-\u036f]/g, "")
             .toLowerCase()
             .trim()
             .replace(/\s+/g, " ")
          );

          if (new Set(normalized).size !== normalized.length){
            throw new Error("DUPLICATE_WITHIN_INVITATION");
          }

          const claims = [];

          for (const personName of claimNames){
            const claimKey = await nameClaimKey(personName);

            claims.push({
              name: personName,
              ref:  ref(db, `rsvpClaims/${EVENT_ID}/${claimKey}`)
            });
          }

          // Verifica todos os nomes antes de reservar qualquer um,
          // para evitar bloqueios parciais.
          for (const claim of claims){
            const existing = await get(claim.ref);

            if (existing.exists()){
              throw new Error("DUPLICATE_NAME:" + claim.name);
            }
          }

          for (const claim of claims){
            const result = await runTransaction(
              claim.ref,
              current => current === null
                ? { rsvpId: newRef.key, createdAt: Date.now() }
                : undefined,
              { applyLocally: false }
            );

            if (!result.committed){
              throw new Error("DUPLICATE_NAME:" + claim.name);
            }
          }

          await set(newRef, record);

          feedback.textContent = "Resposta guardada! A abrir o WhatsApp…";

          const phone = String(data.whatsapp || "").replace(/\D/g, "");

          if (phone){
            const companionsText = (record.companionDetails || [])
              .map((c, i) => `\n   ${i+1}. ${c.name} — ${c.age} anos`)
              .join("");

            const message = attendance === "yes"
              ? `Confirmação de presença — ${data.hosts || data.groom + " & " + data.bride}\nNome: ${name}\nTotal de acompanhantes: ${record.companions}${companionsText}`
              : `Resposta ao convite — ${data.hosts || data.groom + " & " + data.bride}\nNome: ${name}\nNão poderá comparecer.\nMotivo: ${record.reason}`;

            window.open(
              `https://wa.me/${phone}?text=${encodeURIComponent(message)}`,
              "_blank",
              "noopener"
            );

          } else {
            feedback.textContent =
              "Resposta guardada, mas o WhatsApp do casal ainda não foi configurado no painel index.html.";
          }

        } catch(error){
          console.error(error);

          feedback.textContent = error.message?.startsWith("DUPLICATE_NAME:")
            ? `O nome “${error.message.split(":").slice(1).join(":")}” já está associado a outro convite. Verifique o nome do convidado e dos acompanhantes.`
            : error.message === "DUPLICATE_WITHIN_INVITATION"
              ? "O convidado e os acompanhantes não podem ter nomes repetidos no mesmo convite."
              : "Não foi possível enviar. Tente novamente.";

          button.disabled    = false;
          button.textContent = "Tentar novamente";
        }
      });
    };

    $("yesChoice").addEventListener("click", () => openForm("yes"));
    $("noChoice").addEventListener("click",  () => openForm("no"));
  }
};

window.closePanel = function(){
  $("overlay").classList.remove("active");
};

$("overlay").addEventListener("click", e => {
  if (e.target === $("overlay")) closePanel();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closePanel();
});

async function init(){
  try{
    const snapshot = await get(ref(db, "publicEvents/" + EVENT_ID));

    if (!snapshot.exists()){
      $("invitationContent").innerHTML = "Este convite não foi encontrado.";
      return;
    }

    data = snapshot.val();

    // Compatibilidade entre os nomes dos campos do painel e do convite.
    data.groom     = data.groom     || (data.hosts || "").split("&")[0]?.trim() || "";
    data.bride     = data.bride     || (data.hosts || "").split("&")[1]?.trim() || "";
    data.verse     = data.verse     || data.quote || "";
    data.verseRef  = data.verseRef  || data.quoteRef || "";
    data.subtitle  = data.subtitle  || data.message || "";
    data.placeName = data.placeName || data.venue || "";

    render();

  } catch(error){
    console.error(error);
    $("invitationContent").innerHTML =
      "Não foi possível carregar o convite. Verifique a ligação à internet.";
  }
}

init();
</script>
